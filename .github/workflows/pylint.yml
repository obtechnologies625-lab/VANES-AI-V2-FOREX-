name: VANES CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint
      - name: Syntax check
        run: python -m compileall -q vanes tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Realtime chatbot E2E
        run: python -m unittest tests.test_e2e -v
      - name: Pylint
        run: pylint vanes

  cloudflare:
    name: Cloudflare Worker validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install Cloudflare dependencies
        run: npm install
      - name: Validate Worker source
        run: node --check src/index.js
      - name: Validate Wrangler configuration
        run: npx wrangler deploy --dry-run
