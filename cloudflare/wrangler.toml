name = "vanes-ai-v2"
main = "src/index.js"
compatibility_date = "2026-09-19"

# Optional KV storage for the latest VANES state.
# Create a namespace with: wrangler kv namespace create VANES_STATE
# Then replace both placeholder IDs below.
[[kv_namespaces]]
binding = "VANES_STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_NAMESPACE_ID"
