[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanes-ai-v2-forex"
version = "0.2.0"
description = "VANES-AI V2 Forex observer, analysis and paper-trading application"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9"]

[project.scripts]
vanes-forex = "vanes.app:main"

[tool.setuptools.packages.find]
include = ["vanes*"]
